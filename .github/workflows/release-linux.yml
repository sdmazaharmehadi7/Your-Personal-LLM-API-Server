name: Build & Release Linux Desktop

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x64 Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            curl \
            zip \
            unzip

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.7'
          cache: true

      - name: Enable Linux Desktop Support
        run: flutter config --enable-linux-desktop

      - name: Verify Environment
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Automated Test Suite
        run: flutter test

      - name: Build Linux Desktop Release
        run: flutter build linux --release

      - name: Verify Build Artifacts
        run: |
          BUILD_DIR="build/linux/x64/release/bundle"
          if [ ! -f "$BUILD_DIR/sovereign_ai" ]; then
            echo "Error: Linux executable sovereign_ai not found in $BUILD_DIR"
            exit 1
          fi
          echo "Linux release successfully built in $BUILD_DIR"
          ls -la "$BUILD_DIR"

      - name: Package Linux Release Tarball
        run: |
          BUILD_DIR="build/linux/x64/release/bundle"
          PACKAGE_DIR="dist/SovereignAI-1.0.0-linux-x64"
          mkdir -p "$PACKAGE_DIR"
          cp -r "$BUILD_DIR/"* "$PACKAGE_DIR/"

          printf "%s\n" \
            "Sovereign AI for Linux (x64)" \
            "Version: 1.0.0" \
            "============================" \
            "" \
            "SYSTEM REQUIREMENTS:" \
            "- Ubuntu 20.04+, Debian 11+, Fedora 36+, or compatible Linux distribution" \
            "- 64-bit x86_64 CPU (AVX2 recommended)" \
            "- 4GB RAM minimum (8GB+ recommended)" \
            "- Standard GTK3 runtime libraries (libgtk-3-0)" \
            "" \
            "HOW TO RUN:" \
            "1. Extract the tar.gz archive:" \
            "   tar -xzf SovereignAI-1.0.0-linux-x64.tar.gz" \
            "2. Run the executable:" \
            "   ./sovereign_ai" \
            "3. Manage and download offline GGUF models in the Model Manager tab." \
            "4. Download the 23MB all-MiniLM-L6-v2 embedding model for instant neural RAG." \
            "" \
            "PRIVACY & OFFLINE GUARANTEE:" \
            "Zero external servers or cloud inference. All operations run directly on your hardware." \
            > "$PACKAGE_DIR/README.txt"

          tar -czvf SovereignAI-1.0.0-linux-x64.tar.gz -C dist SovereignAI-1.0.0-linux-x64
          sha256sum SovereignAI-1.0.0-linux-x64.tar.gz > SovereignAI-1.0.0-linux-x64.tar.gz.sha256
          cat SovereignAI-1.0.0-linux-x64.tar.gz.sha256

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SovereignAI-Linux-x64
          path: |
            SovereignAI-1.0.0-linux-x64.tar.gz
            SovereignAI-1.0.0-linux-x64.tar.gz.sha256
          retention-days: 30

name: Build & Release iOS

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS Release & IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.7'
          cache: true

      - name: Setup Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis & Tests
        run: |
          flutter analyze
          flutter test

      - name: Configure Code Signing (if secrets present)
        id: codesign
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary_keychain_password' }}
        run: |
          if [ -n "$CERTIFICATE_BASE64" ] && [ -n "$PROVISIONING_PROFILE_BASE64" ]; then
            echo "has_signing=true" >> $GITHUB_OUTPUT
            echo "Configuring Apple Developer Signing Keychain..."

            # Create temporary keychain
            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            # Import certificate
            CERT_PATH=$RUNNER_TEMP/certificate.p12
            echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
            security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            # Import provisioning profile
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          else
            echo "has_signing=false" >> $GITHUB_OUTPUT
            echo "No signing secrets provided. Will perform full compilation and unsigned IPA packaging."
          fi

      - name: Build iOS Release
        run: |
          if [ "${{ steps.codesign.outputs.has_signing }}" = "true" ]; then
            flutter build ipa --release
          else
            flutter build ios --release --no-codesign
            mkdir -p build/ios/ipa/Payload
            cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
            cd build/ios/ipa
            zip -r SovereignAI-1.0.0-ios-unsigned.ipa Payload
            shasum -a 256 SovereignAI-1.0.0-ios-unsigned.ipa > SovereignAI-1.0.0-ios-unsigned.ipa.sha256
          fi

      - name: Upload iOS Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SovereignAI-iOS
          path: |
            build/ios/ipa/*.ipa
            build/ios/ipa/*.sha256
          retention-days: 30
